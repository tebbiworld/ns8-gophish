#
# Restic include patterns for the GoPhish module backup (paths relative to /srv).
# Without this file the NS8 backup would contain state/environment only.
# The gophish-data volume holds config.json and the SQLite database
# (gophish.db) with all users, campaigns, templates and results.
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
#
state/environment
state/gophish.env
volumes/gophish-data
